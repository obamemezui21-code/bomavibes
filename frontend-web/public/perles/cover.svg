    <ellipse cx="960" cy="90" rx="140" ry="70" fill="#3e6b22"/>
    <ellipse cx="120" cy="520" rx="170" ry="70" fill="#2e5219"/>
    <ellipse cx="900" cy="530" rx="180" ry="80" fill="#2e5219"/>
    <ellipse cx="520" cy="40" rx="200" ry="40" fill="#6b8f32"/>
  </g>

  <!-- the river bed -->
  <path d="M -40 470 C 140 560, 330 540, 380 430 C 430 320, 330 170, 470 110 C 620 50, 820 120, 830 280 C 840 420, 700 470, 640 400" fill="none" stroke="#2a1d10" stroke-opacity="0.45" stroke-width="64" stroke-linecap="round"/>
  <path d="M -40 470 C 140 560, 330 540, 380 430 C 430 320, 330 170, 470 110 C 620 50, 820 120, 830 280 C 840 420, 700 470, 640 400" fill="none" stroke="#4a3420" stroke-width="54" stroke-linecap="round"/>
  <path d="M -40 470 C 140 560, 330 540, 380 430 C 430 320, 330 170, 470 110 C 620 50, 820 120, 830 280 C 840 420, 700 470, 640 400" fill="none" stroke="#8a6a3c" stroke-opacity="0.6" stroke-width="44" stroke-linecap="round"/>
