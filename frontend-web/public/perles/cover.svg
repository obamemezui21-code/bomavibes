    <circle cx="60" cy="518" r="20" fill="url(#j)"/>
    <circle cx="100" cy="528" r="20" fill="url(#r)"/>
    <circle cx="141" cy="532" r="20" fill="url(#b)"/>
    <circle cx="182" cy="531" r="20" fill="url(#b)"/>
    <circle cx="222" cy="525" r="20" fill="url(#v)"/>
    <circle cx="262" cy="512" r="20" fill="url(#p)"/>
    <circle cx="298" cy="494" r="20" fill="url(#p)"/>
    <circle cx="330" cy="470" r="20" fill="url(#w)"/>
    <circle cx="356" cy="440" r="20" fill="url(#r)"/>
    <circle cx="372" cy="402" r="20" fill="url(#r)"/>
    <circle cx="378" cy="362" r="20" fill="url(#j)"/>
    <circle cx="376" cy="322" r="20" fill="url(#v)"/>
    <circle cx="376" cy="282" r="20" fill="url(#v)"/>
    <circle cx="384" cy="242" r="20" fill="url(#b)"/>
    <circle cx="398" cy="204" r="20" fill="url(#p)"/>
    <circle cx="420" cy="170" r="20" fill="url(#w)"/>
    <circle cx="452" cy="144" r="20" fill="url(#w)"/>
    <circle cx="488" cy="124" r="20" fill="url(#r)"/>
    <circle cx="528" cy="110" r="20" fill="url(#j)"/>
    <circle cx="568" cy="102" r="20" fill="url(#b)"/>
