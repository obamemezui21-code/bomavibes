    <circle cx="738" cy="136" r="20" fill="url(#v)"/>
    <circle cx="772" cy="162" r="20" fill="url(#p)"/>
    <circle cx="798" cy="194" r="20" fill="url(#r)"/>
    <circle cx="815" cy="232" r="20" fill="url(#j)"/>
