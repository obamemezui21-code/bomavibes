<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" width="1024" height="572">
  <!-- Perles Punu: the white Punu mask, a river of beads winding around it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6a27"/>
      <stop offset="1" stop-color="#16280c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff2cf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.7" stop-color="#ece2cc"/>
      <stop offset="1" stop-color="#bfb092"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
