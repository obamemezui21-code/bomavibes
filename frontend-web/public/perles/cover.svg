      <ellipse cx="-19" cy="-19" rx="11" ry="13" transform="rotate(-23 -19 -19)"/>
      <ellipse cx="19" cy="-19" rx="11" ry="13" transform="rotate(23 19 -19)"/>
    </g>
    <g stroke="#fff" stroke-opacity="0.12" stroke-width="1" fill="none">
      <path d="M -10 -46 Q -13 -32 -11 -16"/><path d="M -5 -46 Q -6.5 -32 -5.5 -16"/><path d="M 0 -46 Q 0 -32 0 -16"/>
      <path d="M 5 -46 Q 6.5 -32 5.5 -16"/><path d="M 10 -46 Q 13 -32 11 -16"/>
