    <radialGradient id="r" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ff8a7a"/><stop offset="0.5" stop-color="#d63a2c"/><stop offset="1" stop-color="#7b1d14"/></radialGradient>
    <radialGradient id="j" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#fff0a0"/><stop offset="0.5" stop-color="#f2b90f"/><stop offset="1" stop-color="#8a6300"/></radialGradient>
    <radialGradient id="v" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#9af5b8"/><stop offset="0.5" stop-color="#24a858"/><stop offset="1" stop-color="#0e5229"/></radialGradient>
    <radialGradient id="b" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#a6dcff"/><stop offset="0.5" stop-color="#2a7fd4"/><stop offset="1" stop-color="#113a6d"/></radialGradient>
    <radialGradient id="p" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#e2bcff"/><stop offset="0.5" stop-color="#9146b8"/><stop offset="1" stop-color="#47195f"/></radialGradient>
    <radialGradient id="w" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#ddd5c4"/><stop offset="1" stop-color="#867b65"/></radialGradient>
