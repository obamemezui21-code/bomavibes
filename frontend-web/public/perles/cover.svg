  <g fill="#fff" opacity="0.55">
    <circle cx="14" cy="495" r="5"/><circle cx="54" cy="511" r="5"/><circle cx="94" cy="521" r="5"/><circle cx="135" cy="525" r="5"/>
    <circle cx="176" cy="524" r="5"/><circle cx="216" cy="518" r="5"/><circle cx="256" cy="505" r="5"/><circle cx="292" cy="487" r="5"/>
    <circle cx="324" cy="463" r="5"/><circle cx="350" cy="433" r="5"/><circle cx="366" cy="395" r="5"/><circle cx="372" cy="355" r="5"/>
    <circle cx="370" cy="315" r="5"/><circle cx="370" cy="275" r="5"/><circle cx="378" cy="235" r="5"/><circle cx="392" cy="197" r="5"/>
    <circle cx="414" cy="163" r="5"/><circle cx="446" cy="137" r="5"/><circle cx="482" cy="117" r="5"/><circle cx="522" cy="103" r="5"/>
    <circle cx="562" cy="95" r="5"/><circle cx="694" cy="111" r="5"/><circle cx="732" cy="129" r="5"/><circle cx="766" cy="155" r="5"/>
