      <path d="M-3.5 -10.6 L-2.2 -9 L-3.5 -7.4 L-4.8 -9Z"/><path d="M3.5 -10.6 L4.8 -9 L3.5 -7.4 L2.2 -9Z"/>
      <path d="M0 -7.6 L1.3 -6 L0 -4.4 L-1.3 -6Z"/>
    </g>
    <g stroke="#1d140c" stroke-width="1.6" stroke-linecap="round" fill="none">
