name: Deploy BomaVibes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.77.100.93
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/bomavibes
            ./deploy.sh